<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>WISHLAND</title>
  <link rel="icon" type="image/png" href="icon.jpg" />
  <link rel="apple-touch-icon" href="icon.jpg" />
  <meta property="og:title" content="WISHLAND" />
  <meta property="og:image" content="https://welcometowishland.vercel.app/icon.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  
  <header class="navbar" id="navbar">
    <div class="nav-left">
      <a href="#" class="logo" id="reset-home">WISH<span>LAND</span></a>
    </div>
    <div class="nav-right">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="搜尋名稱、關鍵字..." autocomplete="off" />
        <button id="clear-search" class="clear-btn" title="清除搜尋">✕</button>
      </div>
      <button id="random-btn" class="btn-outline" title="不知道看哪集？隨機推薦">🎲 隨機看</button>
    </div>
  </header>

  
  <section class="hero" id="hero-banner">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
     
      <h1 class="hero-title" id="hero-title">NCT WISH 'I SPY' MV</h1>
      <p class="hero-desc" id="hero-desc">NCT WISH's 4th mini album \"I SPY\" is out!</p>
      <div class="hero-actions">
        <a href="#" target="_blank" rel="noopener noreferrer" id="hero-link" class="btn-primary">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          立即觀看
        </a>
      </div>
    </div>
  </section>

  
  <section class="filter-bar">
    <div class="filter-group" id="member-filters">
      
      <div class="category-dropdown" id="category-dropdown">
        <button type="button" class="filter-chip category-trigger" id="category-btn">
          <span id="category-label">類別</span>
          <svg class="chevron-icon" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <div class="category-menu" id="category-menu">
          <button type="button" class="category-item active" data-series="ALL">全部類別</button>
         
        </div>
      </div>

      <span class="filter-divider"></span>

     
      <button class="filter-chip active" data-member="ALL">全部</button>
      <button class="filter-chip" data-member="OT6">團體</button>
      <button class="filter-chip" data-member="SION">SION</button>
      <button class="filter-chip" data-member="RIKU">RIKU</button>
      <button class="filter-chip" data-member="YUSHI">YUSHI</button>
      <button class="filter-chip" data-member="JAEHEE">JAEHEE</button>
      <button class="filter-chip" data-member="RYO">RYO</button>
      <button class="filter-chip" data-member="SAKUYA">SAKUYA</button>
    </div>
  </section>

  
  <main class="main-content" id="content-container">
    <div class="loading-state">正在載入片單 ... (꧞ˆᢦˆ)</div>
  </main>

  <footer class="footer">
    <p> 本站內容為個人整理，相關版權皆歸原所屬公司及權利人所有。</p>
  </footer>
  
<div class="modal-backdrop" id="random-modal">
    <div class="random-card">
      <button type="button" class="random-close" id="close-random">✕</button>
      <div class="random-thumb-wrap">
        <img id="random-thumb" src="" alt="" />
      </div>
      <div class="random-info">
        <div class="random-meta">
          <span class="random-badge" id="random-series"></span>
          <span class="random-date" id="random-date"></span>
        </div>
        <h3 class="random-title" id="random-title"></h3>
        <div class="random-actions">
          <a href="#" target="_blank" rel="noopener noreferrer" id="random-watch-btn" class="btn-primary">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            立即觀看
          </a>
          <button type="button" id="random-reroll-btn" class="btn-outline">🎲 換一部</button>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
