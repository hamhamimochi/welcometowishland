<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WISHLAND — NCT WISH 綜藝索引</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <!-- 引入 PapaParse 用於精準解析 Notion 匯出的 CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header class="navbar" id="navbar">
    <div class="nav-left">
      <a href="#" class="logo" id="reset-home">WISH<span>LAND</span></a>
    </div>
    <div class="nav-right">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="搜尋集數名稱、關鍵字..." autocomplete="off" />
        <button id="clear-search" class="clear-btn" title="清除搜尋">✕</button>
      </div>
      <button id="random-btn" class="btn-outline" title="不知道看哪集？隨機推薦">🎲 隨機看</button>
    </div>
  </header>

  <!-- 首頁大看板 (Hero Banner) - 預設放最新 MV -->
  <section class="hero" id="hero-banner">
    <div class="hero-bg" id="hero-bg"></div>
    <div class="hero-gradient"></div>
    <div class="hero-content">
     
      <h1 class="hero-title" id="hero-title">NCT WISH 'I SPY' MV</h1>
      <p class="hero-desc" id="hero-desc">NCT WISH's 4th mini album \"I SPY\" is out!</p>
      <div class="hero-actions">
        <a href="#" target="_blank" rel="noopener noreferrer" id="hero-link" class="btn-primary">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          立即觀看 MV
        </a>
      </div>
    </div>
  </section>

  <!-- 成員與系列快速篩選列 -->
  <section class="filter-bar">
    <div class="filter-group" id="member-filters">
      <button class="filter-chip active" data-member="ALL">全部</button>
     <button class="filter-chip" data-member="OT6">團體</button>
      <button class="filter-chip" data-member="SION">SION</button>
      <button class="filter-chip" data-member="RIKU">RIKU</button>
      <button class="filter-chip" data-member="YUSHI">YUSHI</button>
      <button class="filter-chip" data-member="JAEHEE">JAEHEE</button>
      <button class="filter-chip" data-member="RYO">RYO</button>
      <button class="filter-chip" data-member="SAKUYA">SAKUYA</button>
    </div>
  </section>

  <!-- 主內容區：依 Series 自動產生橫向輪播列，或在搜尋/篩選時切換為網格牆 -->
  <main class="main-content" id="content-container">
    <div class="loading-state">正在載入 WISHLAND 片單...</div>
  </main>

  <footer class="footer">
    <p> All videos belong to SM Entertainment & NCT WISH Official.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
